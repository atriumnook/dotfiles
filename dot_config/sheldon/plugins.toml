shell = "zsh"

apply = ["defer"]

[templates]
defer = "{{ hooks | get: \"pre\" | nl }}{% for file in files %}zsh-defer source \"{{ file }}\"\n{% endfor %}{{ hooks | get: \"post\" | nl }}"

[plugins.zsh-defer]
github = "romkatv/zsh-defer"
apply = ["source"]

[plugins.starship]
inline = 'eval "$(starship init zsh)"'

[plugins.autosuggest-config]
inline = "ZSH_AUTOSUGGEST_CLEAR_WIDGETS+=(bracketed-paste)"

[plugins.mise-completion]
inline = "zsh-defer -c '(( $+commands[mise] )) && source <(mise completion zsh)'"

[plugins.yazi]
inline = '''
y() {
  local tmp="$(mktemp -t "yazi-cwd.XXXXX")"
  yazi "$@" --cwd-file="$tmp"
  if cwd="$(<"$tmp")" && [ -n "$cwd" ] && [ "$cwd" != "$PWD" ]; then
    builtin cd -- "$cwd"
  fi
  rm -f -- "$tmp"
}
'''

[plugins.zsh-completions]
github = "zsh-users/zsh-completions"

[plugins.compinit]
inline = "zsh-defer -c 'autoload -Uz compinit && compinit'"

[plugins.fzf]
inline = "zsh-defer -c 'source <(fzf --zsh)'"

[plugins.fzf-tab]
github = "Aloxaf/fzf-tab"

[plugins.zsh-abbr]
github = "olets/zsh-abbr"

[plugins.zsh-config]
local = "~/.config/zsh"
use = ["alias.zsh"]

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"

[plugins.atuin]
inline = '''
zsh-defer -c 'eval "$(atuin init zsh --disable-up-arrow --disable-ctrl-r)"'
'''

[plugins.zoxide]
inline = '''
zsh-defer -c '[[ "$CLAUDECODE" != "1" ]] && eval "$(zoxide init --cmd cd zsh)"'
'''

[plugins.fast-syntax-highlighting]
github = "zdharma-continuum/fast-syntax-highlighting"
