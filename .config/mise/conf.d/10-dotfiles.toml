# ── mise グローバル設定(dotfiles 管理分)──
# ~/.config/mise/conf.d/10-dotfiles.toml として配置される。
# ~/.config/mise/config.toml は omarchy の mise ラッパー(`mise use -g`)や手動の
# `mise use -g` が書き込む machine-local ファイルなので、ここでは管理しない。
#
# 有効化する environment は各マシンの ~/.config/mise/miserc.local.toml で宣言する:
#   profile : personal / work
#   OS      : linux / windows
#   class   : omarchy / wsldebian
#   module  : cli / personal-cli(omarchy 以外の機で、omarchy が提供するツールを mise で補う)
# dotfiles.root は mise 既定の ~/.dotfiles を使用(設定不要)。

[settings]
lockfile = true
disable_backends = ["asdf", "vfox"]
minimum_release_age_excludes = ["claude", "codex", "antigravity-cli"]

# omarchy / システム管理下のパスを history の capture/autosave から恒久除外
[history]
exclude = ["~/.config/hypr/**", "~/.local/share/omarchy/**"]

[tools]
# omarchy が pacman / omarchy-mise-install で提供するツール(node, fd, claude など)は
# ここに書かず config.cli.toml / config.personal-cli.toml に置く。ここに書くと omarchy 機で
# omarchy の管理を上書きする。
# --- Runtimes ---
bun = "1"
uv = "0"
# --- CLI(全 OS 共通)---
age = "1"
ast-grep = "0"
atuin = "18"
delta = "0"
yazi = "26"
# --- AI ---
apm = "0"
"github:tomasz-tomczyk/crit" = "0"
"github:yusukebe/ax" = "0"
# --- Linux 限定(旧 $isLinux)---
sheldon = { version = "0", os = "linux" }

# ── dotfiles(全 OS 共通分。OS 固有分は config.linux.toml / config.windows.toml)──
# source を省略すると dotfiles.root(~/.dotfiles)配下の同パスが参照される。
[dotfiles]
"~/.claude/CLAUDE.md" = { mode = "symlink" }
"~/.claude/bun-braille-dots-statusline.mjs" = { mode = "symlink" }
"~/.claude/bun-file-suggestion.mjs" = { mode = "symlink" }
"~/.claude/hooks/_lib.sh" = { mode = "symlink" }
"~/.claude/hooks/executable-guard-secrets.sh" = { mode = "symlink" }
"~/.claude/hooks/executable-notify-linux.sh" = { mode = "symlink" }
"~/.claude/hooks/executable-notify-windows.sh" = { mode = "symlink" }
"~/.claude/hooks/executable-notify.sh" = { mode = "symlink" }
"~/.claude/hooks/executable-pre-bash-policy.sh" = { mode = "symlink" }
"~/.claude/hooks/executable-pre-compact.sh" = { mode = "symlink" }
"~/.claude/hooks/executable-scan-secrets.sh" = { mode = "symlink" }
"~/.claude/hooks/notify-icon.png" = { mode = "symlink" }
"~/.claude/output-styles/ELI5.md" = { mode = "symlink" }
"~/.claude/skills/html-artifact/SKILL.md" = { mode = "symlink" }
"~/.claude/skills/reframe/SKILL.md" = { mode = "symlink" }
"~/.claude/skills/unslop-ja/SKILL.md" = { mode = "symlink" }
"~/.claude/skills/unslop-ja/slides.md" = { mode = "symlink" }
"~/.config/starship.toml" = { mode = "symlink" }

# ~/.gitconfig は symlink にしない。`git config --global`(gh auth setup-git や omarchy の
# user 設定を含む)の書き込み先なので、symlink だとその内容が repo に入る。共通設定を
# include する1行だけを先頭に入れ、credential など後に書いたマシンごとの値を優先させる。
"~/.config/git/dotfiles.gitconfig" = { mode = "symlink" }
"~/.gitconfig/dotfiles" = { line = "[include] path = ~/.config/git/dotfiles.gitconfig", position = "prepend" }

# settings.json は Claude Code 自身が書き換える(model / enabledPlugins 等)ため
# symlink にせず、repo 側のキーだけを実ファイルへ merge する。
# アプリが追加したキーは保持され、repo 側にあるキーは apply で repo の値に戻る。
"~/.claude/settings.json/shared" = { merge = true }

# mise 設定自身の配置
"~/.config/mise/conf.d/10-dotfiles.toml" = { mode = "symlink" }
"~/.config/mise/config.personal.toml" = { mode = "symlink" }
"~/.config/mise/config.work.toml" = { mode = "symlink" }
"~/.config/mise/config.omarchy.toml" = { mode = "symlink" }
"~/.config/mise/config.wsldebian.toml" = { mode = "symlink" }
"~/.config/mise/config.linux.toml" = { mode = "symlink" }
"~/.config/mise/config.windows.toml" = { mode = "symlink" }
"~/.config/mise/config.cli.toml" = { mode = "symlink" }
"~/.config/mise/config.personal-cli.toml" = { mode = "symlink" }
