# 素の環境で mise bootstrap を実行し、すぐ使える状態になるかを検証する。
# 検証の中身は .github/scripts/bootstrap-test.{sh,ps1} を参照。
name: bootstrap

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_MISE_VERSION: "2026.10.21"
  # GitHub API のレート制限を避けるため mise に渡す
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  linux:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [debian, archlinux, custom-mise-dirs]
        include:
          - target: debian
            container: debian:stable-slim
          - target: archlinux
            container: archlinux:latest
          # mise の公式 Docker イメージと同じく MISE_DATA_DIR / MISE_CONFIG_DIR / MISE_CACHE_DIR を変える
          - target: custom-mise-dirs
            container: debian:stable-slim
            custom_mise_dirs: "1"
    env:
      TEST_TARGET: ${{ matrix.target }}
      TEST_MISE_ENV: '["personal", "linux", "wsldebian", "cli", "personal-cli"]'
      TEST_CUSTOM_MISE_DIRS: ${{ matrix.custom_mise_dirs }}
    steps:
      # actions/checkout は git が無いと .git を作らないため、先に入れる
      - name: Install prerequisites
        shell: bash
        run: |
          if command -v pacman >/dev/null; then
            pacman -Syu --noconfirm --needed git zsh curl unzip xz
          else
            apt-get update -q && apt-get install -y -q git zsh curl ca-certificates unzip xz-utils bzip2
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bootstrap and verify
        shell: bash
        run: .github/scripts/bootstrap-test.sh

  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      TEST_MISE_ENV: '["personal", "windows", "cli", "personal-cli"]'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bootstrap and verify
        shell: pwsh
        run: .github/scripts/bootstrap-test.ps1
